name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Prepare profile asset directory
        run: mkdir -p profile

      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hassan0086
          outputs: |
            profile/github-contribution-grid-snake.svg?palette=github-light
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit snake assets
        run: |
          git add profile/github-contribution-grid-snake.svg profile/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No snake changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution snake"
          git push

  stats:
    needs: snake
    name: Generate GitHub stats cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Prepare profile asset directory
        run: mkdir -p profile

      - name: Generate statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Hassan0086&show_icons=true&include_all_commits=true&hide_border=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Hassan0086&layout=compact&langs_count=8&hide_border=true&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit statistics cards
        run: |
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "No stats changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub stats"
          git push

  streak:
    needs: stats
    name: Generate contribution streak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Prepare profile asset directory
        run: mkdir -p profile

      - name: Generate streak card
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Hassan0086&theme=tokyonight&hide_border=true&disable_animations=false&card_width=900
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak card
        run: |
          git add profile/streak.svg
          if git diff --cached --quiet; then
            echo "No streak changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution streak"
          git push

  metrics:
    needs: streak
    name: Generate GitHub metrics
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: profile/metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Hassan0086
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          config_padding: 6%
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub metrics [Skip GitHub Action]"
